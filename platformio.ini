[platformio]
build_cache_dir = .pio/build_cache

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.10
    adafruit/Adafruit SSD1306 @ ^2.5.11
    adafruit/Adafruit BusIO @ ^1.16.1
    SPI
    WiFi
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFREERTOS_HZ=1000



